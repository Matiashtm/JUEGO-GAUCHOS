<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Celular Horizontal a Pantalla Completa</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .pantalla {
      height: 100vh;
      width: 500px;
      max-width: 2000px;
      background-color: #111;
      border-left: 40px solid black;
      border-right: 40px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

     #ESCENARIO {
            position: absolute;
            width: 1000px; /* Ancho de la cabina */
            height: 100%; /* Altura de la cabina */
            background-image: url('ESCENARIO.png'); /* Ruta a la imagen PNG */
            background-size: contain; /* Ajusta la imagen al tamaño del div */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen en el div */
            margin-top: 25%;
            margin-left: -80px; /* Posición inicial */
            transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
            z-index: 1;
        }

     #CARRETA {
            position: absolute;
            width: 700px; /* Ancho de la cabina */
            height: 700px; /* Altura de la cabina */
            background-image: url('TACHOS.png'); /* Ruta a la imagen PNG */
            background-size: contain; /* Ajusta la imagen al tamaño del div */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen en el div */
			  top: 400px; /* Posición inicial */
			  left: -150px; /* Posición inicial */
			  transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
            z-index: 6;
        }

     #BARRERA_IZQUIERDA {
            position: absolute;
            width: 500px; /* Ancho de la cabina */
            height: 500px; /* Altura de la cabina */
            background-image: url('CERCA IZQUIERDA.png'); /* Ruta a la imagen PNG */
            background-size: contain; /* Ajusta la imagen al tamaño del div */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen en el div */
			  top: 250px; /* Posición inicial */
			  left: -300px; /* Posición inicial */
			  transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
            z-index: 5;
        }
     #BARRERA_CENTRAL {
            position: absolute;
            width: 200px; /* Ancho de la cabina */
            height: 200px; /* Altura de la cabina */
            background-image: url('TACHOS.png'); /* Ruta a la imagen PNG */
            background-size: contain; /* Ajusta la imagen al tamaño del div */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen en el div */
			  top: 390px; /* Posición inicial */
			  left: 100px; /* Posición inicial */
			  transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
            z-index: 3;
        }

    #BARRERA_DERECHA {
            position: absolute;
            width: 400px; /* Ancho de la cabina */
            height: 400px; /* Altura de la cabina */
            background-image: url('CERCA DERECHA.png'); /* Ruta a la imagen PNG */
            background-size: contain; /* Ajusta la imagen al tamaño del div */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen en el div */
			  top: 300px; /* Posición inicial */
			  left: 300px; /* Posición inicial */
			  transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
            z-index: 5;
        }

      #ENEMIGO_IZQUIERDA {
            position: absolute;
            width: 250px; /* Ancho de la cabina */
            height: 250px; /* Altura de la cabina */
            background-image: url('ENE IZQ.png'); /* Ruta a la imagen PNG */
            background-size: contain; /* Ajusta la imagen al tamaño del div */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen en el div */
			  top: 290px; /* Posición inicial */
			  left: -20px; /* Posición inicial */
			  transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
            z-index: 4;
        }

           #ENEMIGO_DERECHA {
            position: absolute;
            width: 230px; /* Ancho de la cabina */
            height: 230px; /* Altura de la cabina */
            background-image: url('ENE DER.png'); /* Ruta a la imagen PNG */
            background-size: contain; /* Ajusta la imagen al tamaño del div */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen en el div */
			  top: 300px; /* Posición inicial */
			  left: 250px; /* Posición inicial */
			  transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
            z-index: 4;
        }







	#GAUCHO {
     position: absolute;
     width: 400px; /* Ancho de la cabina */
     height: 400px; /* Altura de la cabina */
     background-image: url('APUNTANDO.png'); /* Ruta a la imagen PNG */
     background-size: contain; /* Ajusta la imagen al tamaño del div */
     background-repeat: no-repeat; /* Evita que la imagen se repita */
     background-position: center; /* Centra la imagen en el div */
	top: 400px; /* Posición inicial */
	left: 0px; /* Posición inicial */
	transition: top 1s ease, left 1s ease; /* Animación en ambas direcciones */
	  z-index: 7;
        
	}



  </style>
</head>
<body>
  <div class="pantalla">
    <div id="GAUCHO"></div>
		<div id="CARRETA"></div>
		<div id="BARRERA_IZQUIERDA"></div>
		<div id="BARRERA_CENTRAL"></div>
		<div id="BARRERA_DERECHA"></div>
		<div id="ENEMIGO_IZQUIERDA"></div>
		<div id="ENEMIGO_DERECHA"></div>
		<div id="ESCENARIO"></div>
		<div id="posicion" style="position: fixed; top: 10px; left: 10px; color: white; background: black; padding: 5px; z-index: 999;"></div>

  </div>

<script>
  const imgESCENARIO = document.getElementById("ESCENARIO");
  const imgGAUCHO = document.getElementById("GAUCHO");
  const imgCARRETA = document.getElementById("CARRETA");
  const imgBARRERA_IZQUIERDA = document.getElementById("BARRERA_IZQUIERDA");
  const imgBARRERA_CENTRAL = document.getElementById("BARRERA_CENTRAL");
  const imgBARRERA_DERECHA = document.getElementById("BARRERA_DERECHA");
  let imgENEMIGO_IZQUIERDA = document.getElementById("ENEMIGO_IZQUIERDA");
  const imgENEMIGO_DERECHA = document.getElementById("ENEMIGO_DERECHA");
  const pantalla = document.querySelector(".pantalla");
  const divPos = document.getElementById("posicion");

  let mouseX = 0, mouseY = 0;
  const posiciones = {};
  let ENEMIGOS_TOTALES=10;
  let CARGANDO_GAUCHO = 0;
  let ESTADO_MIRA=0;
  let ESTADO_ENEMIGO_IZQUIERDA = 0;
  let ESTADO_ENEMIGO_DERECHA = 0;


  window.onload = () => {
    [imgESCENARIO, imgCARRETA, imgBARRERA_IZQUIERDA, imgBARRERA_CENTRAL, imgBARRERA_DERECHA, imgENEMIGO_IZQUIERDA, imgENEMIGO_DERECHA].forEach((el, i) => {
      const name = ["escenario", "carreta", "barrera_izq", "barrera_cent", "barrera_der", "enemigo_izq", "enemigo_der"][i];
      posiciones[name] = {
        left: parseInt(getComputedStyle(el).left) || 0,
        top: parseInt(getComputedStyle(el).top) || 0
      };
    });
  };

  document.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    divPos.innerText = `X: ${mouseX} - Y: ${mouseY}`;
  });

  setInterval(() => {
    let offset = 0;
    if (mouseX >= 550 && mouseX < 750) offset = 200, ESTADO_MIRA = 1;
    else if (mouseX >= 900 && mouseX <= 1050) offset = -150, ESTADO_MIRA = 1;

    imgESCENARIO.style.left = posiciones.escenario.left + offset + "px";
    imgCARRETA.style.left = posiciones.carreta.left + offset + "px";
    imgCARRETA.style.top = posiciones.carreta.top + "px";
    imgBARRERA_IZQUIERDA.style.left = posiciones.barrera_izq.left + offset + "px";
    imgBARRERA_CENTRAL.style.left = posiciones.barrera_cent.left + offset + "px";
    imgBARRERA_DERECHA.style.left = posiciones.barrera_der.left + offset + "px";
    imgENEMIGO_IZQUIERDA.style.left = posiciones.enemigo_izq.left + offset + "px";
    imgENEMIGO_DERECHA.style.left = posiciones.enemigo_der.left + offset + "px";
  }, 100);


document.addEventListener("keydown", ({ key }) => {
  if (key === "r" || key === "R") {

    switch (CARGANDO_GAUCHO) {
      case 0:
        CARGANDO_GAUCHO = 1;
        imgGAUCHO.style.left = "-100px";
        imgGAUCHO.style.top = "420px";
        imgGAUCHO.style.backgroundImage = 'url("RECARGANDO.png")';
        break;

      case 1:
        CARGANDO_GAUCHO = 0;
        imgGAUCHO.style.left = "0px";
        imgGAUCHO.style.top = "400px";
        imgGAUCHO.style.backgroundImage = 'url("APUNTANDO.png")';
        break;
    }

  }
});




setInterval(() => {
    enemigo_izq_pos = Math.floor(Math.random() * 4) + 1;
    switch (enemigo_izq_pos) {
        case 1:
            ESTADO_ENEMIGO_IZQUIERDA = 1;
            imgENEMIGO_IZQUIERDA.style.backgroundImage = 'url("ENE IZQ.png")';
            imgENEMIGO_IZQUIERDA.style.top = '290px';
            break;
        case 2:
            ESTADO_ENEMIGO_IZQUIERDA = 2;
            imgENEMIGO_IZQUIERDA.style.backgroundImage = 'url("ENE IZQ 2.png")';
            imgENEMIGO_IZQUIERDA.style.top = '290px';
            setTimeout(() => {
  			imgENEMIGO_IZQUIERDA.style.backgroundImage = 'url("ENE IZQ.png")';
  			imgENEMIGO_IZQUIERDA.style.top = '290px';
			}, 100);
			if(CARGANDO_GAUCHO == 0){
		    imgGAUCHO.style.backgroundImage = 'url("HERIDO.png")';
            setTimeout(() => {
  			imgGAUCHO.style.backgroundImage = 'url("APUNTANDO.png")';
			}, 300);

			}
            break;
        case 3:
            ESTADO_ENEMIGO_IZQUIERDA = 3;
            imgENEMIGO_IZQUIERDA.style.backgroundImage = 'url("ENE IZQ 3.png")';
            imgENEMIGO_IZQUIERDA.style.top = '320px';
            break;
    }

    enemigo_der_pos = Math.floor(Math.random() * 4) + 1;
    switch (enemigo_der_pos) {
        case 1:
            imgENEMIGO_DERECHA.style.backgroundImage = 'url("ENE DER.png")';
            imgENEMIGO_DERECHA.style.top = '300px';
            break;
        case 2:
            imgENEMIGO_DERECHA.style.backgroundImage = 'url("ENE DER 2.png")';
            imgENEMIGO_DERECHA.style.top = '300px';
            setTimeout(() => {
  			imgENEMIGO_DERECHA.style.backgroundImage = 'url("ENE DER.png")';
  			imgENEMIGO_DERECHA.style.top = '300px';
			}, 100);
            break;
        case 3:
            imgENEMIGO_DERECHA.style.backgroundImage = 'url("ENE DER 3.png")';
            imgENEMIGO_DERECHA.style.top = '330px';
            break;
    }
}, 300);


  pantalla.addEventListener("click", () => {

  if(CARGANDO_GAUCHO==0){
    imgGAUCHO.style.backgroundImage = 'url("DISPARO.png")';
    imgCARRETA.style.backgroundImage = 'url("TACHOS LUZ.png")';
         setTimeout(() => {
  			imgGAUCHO.style.backgroundImage = 'url("APUNTANDO.png")';
  			imgCARRETA.style.backgroundImage = 'url("TACHOS.png")';
		}, 100);



     }
  });
</script>



</body>
</html>
